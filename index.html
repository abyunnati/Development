<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyunnati Payments & Receipts</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="login-container" id="loginContainer">
    <div class="login-card">
        <img src="assets/logo.png" class="logo-small" alt="Logo">
        <h2>Abyunnati Login</h2>

        <input type="text" id="userid" placeholder="User ID">
        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="loginError"></p>
    </div>
</div>

<div class="app-container hidden" id="appContainer">

    <header>
        <img src="assets/logo.png" class="logo" alt="Logo">
        <h1>Payments & Receipts</h1>
    </header>

    <div class="receipt-card" id="receiptArea">

        <div class="title-section">
            <h2>Abyunnati</h2>
            <p>Payment Receipt</p>
        </div>

        <div class="form-grid">

            <div>
                <label>Receipt Number</label>
                <input type="text" id="receiptNumber" readonly>
            </div>

            <div>
                <label>Date</label>
                <input type="date" id="date">
            </div>

            <div>
                <label>Name</label>
                <input type="text" id="name">
            </div>

            <div>
                <label>Number</label>
                <input type="text" id="number">
            </div>

            <div>
                <label>Batch ID</label>
                <input type="text" id="batchId">
            </div>

            <div>
                <label>Amount</label>
                <input type="number" id="amount">
            </div>

            <div>
                <label>Payment Mode</label>
                <select id="paymentMode">
                    <option>Cash</option>
                    <option>UPI</option>
                    <option>Bank Transfer</option>
                    <option>Credit Card</option>
                    <option>Debit Card</option>
                </select>
            </div>

        </div>

        <div class="button-group">
            <button onclick="generateReceipt()">Generate Receipt</button>
            <button onclick="downloadPDF()">Download PDF</button>
            <button onclick="logout()">Logout</button>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
